name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  cs:
    uses: altophp/.github/.github/workflows/CS.yml@main
    with:
      php-version: '8.4'
      # composer-validate: true
      # php-cs-fixer-args: '--diff --dry-run'

  sa:
    uses: altophp/.github/.github/workflows/SA.yml@main
    with:
      php-version: '8.4'
      # phpstan-args: 'analyse --no-progress --memory-limit=-1'

  tests:
    name: "PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.brotli.name }})"
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        brotli:
          - name: without Brotli
            extensions: ''
          - name: with Brotli
            extensions: brotli
    uses: altophp/.github/.github/workflows/tests.yml@main
    with:
      php-version: ${{ matrix.php }}
      php-extensions: ${{ matrix.brotli.extensions }}
      # phpunit-args: '--colors=never'

  opentype-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: brotli
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install OpenType Sanitizer 9.2.0
        run: 'python -m pip install --only-binary=:all: opentype-sanitizer==9.2.0'
      - name: Install Brotli CLI
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends brotli
      - run: composer install --no-interaction --prefer-dist
      - name: Test process-backed WOFF2 paths
        run: vendor/bin/phpunit tests/Compression/BrotliProcessCompressorTest.php tests/Writer/Woff2WriterTest.php
      - run: composer validate-opentype
        env:
          OTS_PYTHON: python
